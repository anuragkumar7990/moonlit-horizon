name: Dashboard Health Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deep health check, self-heal, and report
        env:
          BASE_URL: https://moonlit-horizon.vercel.app
          AUTH_HEADER: ${{ secrets.DASHBOARD_AUTH_HEADER }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set +e

          IST_TIME=$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')
          UTC_NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          RUN_URL="https://github.com/anuragkumar7990/moonlit-horizon/actions/runs/$GITHUB_RUN_ID"

          probe_deep() {
            curl -s -w "\n__STATUS__%{http_code}" \
              -H "Authorization: $AUTH_HEADER" \
              --connect-timeout 15 --max-time 40 \
              "$BASE_URL/api/health-deep"
          }

          extract() {
            local raw="$1"
            HTTP=$(echo "$raw" | tail -1 | sed 's/__STATUS__//')
            BODY=$(echo "$raw" | head -n -1)
            OVERALL_OK=$(echo "$BODY" | jq -r '.ok // false' 2>/dev/null)
          }

          # ── Phase 1: Initial probe ─────────────────────────────────────────
          echo "=== Initial probe at $IST_TIME ==="
          extract "$(probe_deep)"
          echo "  HTTP $HTTP, ok=$OVERALL_OK"

          HEAL_LOG=""
          FINAL_BODY="$BODY"
          FINAL_HTTP="$HTTP"
          FINAL_OK="$OVERALL_OK"

          if [ "$OVERALL_OK" != "true" ] || [ "$HTTP" != "200" ]; then
            TS1=$(TZ='Asia/Kolkata' date '+%I:%M %p IST')
            HEAL_LOG="[$TS1] Issues on initial probe (HTTP $HTTP). Retrying in 20s..."
            echo "$HEAL_LOG"
            sleep 20

            # ── Phase 2: Retry ───────────────────────────────────────────────
            echo "=== Retry probe ==="
            extract "$(probe_deep)"
            echo "  HTTP $HTTP, ok=$OVERALL_OK"
            TS2=$(TZ='Asia/Kolkata' date '+%I:%M %p IST')
            HEAL_LOG="$HEAL_LOG\n[$TS2] Retry: HTTP $HTTP, ok=$OVERALL_OK"
            FINAL_BODY="$BODY"; FINAL_HTTP="$HTTP"; FINAL_OK="$OVERALL_OK"

            if [ "$OVERALL_OK" != "true" ] || [ "$HTTP" != "200" ]; then
              if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
                TS3=$(TZ='Asia/Kolkata' date '+%I:%M %p IST')
                echo "Triggering Vercel redeploy..."
                DEPLOY_RESP=$(curl -s -X POST "$VERCEL_DEPLOY_HOOK")
                DEPLOY_ID=$(echo "$DEPLOY_RESP" | jq -r '.job.id // .id // "triggered"' 2>/dev/null)
                HEAL_LOG="$HEAL_LOG\n[$TS3] Vercel redeploy triggered (job: $DEPLOY_ID). Waiting 90s..."
                sleep 90

                # ── Phase 3: Post-deploy verify ──────────────────────────────
                echo "=== Post-redeploy probe ==="
                extract "$(probe_deep)"
                echo "  HTTP $HTTP, ok=$OVERALL_OK"
                TS4=$(TZ='Asia/Kolkata' date '+%I:%M %p IST')
                FINAL_BODY="$BODY"; FINAL_HTTP="$HTTP"; FINAL_OK="$OVERALL_OK"
                if [ "$OVERALL_OK" = "true" ]; then
                  HEAL_LOG="$HEAL_LOG\n[$TS4] Redeploy fixed the issue."
                else
                  HEAL_LOG="$HEAL_LOG\n[$TS4] Redeploy did NOT resolve failures — manual review needed."
                fi
              else
                HEAL_LOG="$HEAL_LOG\nNo VERCEL_DEPLOY_HOOK configured — skipping redeploy."
              fi
            else
              TS2B=$(TZ='Asia/Kolkata' date '+%I:%M %p IST')
              HEAL_LOG="$HEAL_LOG\n[$TS2B] Resolved on retry (transient blip)."
            fi
          fi

          # ── Build integration status lines using jq ────────────────────────
          integration_line() {
            local key="$1" label="$2"
            local ok detail warn lat
            ok=$(echo "$FINAL_BODY"     | jq -r ".integrations.${key}.ok // null" 2>/dev/null)
            detail=$(echo "$FINAL_BODY" | jq -r ".integrations.${key}.detail // \"\"" 2>/dev/null)
            warn=$(echo "$FINAL_BODY"   | jq -r ".integrations.${key}.warning // \"\"" 2>/dev/null)
            lat=$(echo "$FINAL_BODY"    | jq -r ".integrations.${key}.latencyMs // \"\"" 2>/dev/null)

            if [ "$ok" = "true" ];  then icon="✅"
            elif [ "$ok" = "false" ]; then icon="❌"
            else icon="⚪"
            fi

            local lat_str=""
            [ -n "$lat" ] && [ "$lat" != "null" ] && lat_str=" ${lat}ms"

            local line="${icon} **${label}**${lat_str} — ${detail}"
            [ -n "$warn" ] && [ "$warn" != "null" ] && line="${line}  ⚠️ ${warn}"
            echo "$line"
          }

          L_SHEETS=$(integration_line "googleSheets"  "Google Sheets")
          L_ZOHO=$(integration_line   "zoho"          "Zoho CRM")
          L_LUMA=$(integration_line   "luma"          "Luma Events")
          L_CB=$(integration_line     "circleback"    "Circleback")
          L_TRAIN=$(integration_line  "trainerSheets" "Trainer Sheets")
          L_BOT=$(integration_line    "discordBot"    "Discord Bot (VPS)")

          INTEG_BLOCK=$(printf '%s\n%s\n%s\n%s\n%s\n%s' \
            "$L_SHEETS" "$L_ZOHO" "$L_LUMA" "$L_CB" "$L_TRAIN" "$L_BOT")

          # ── Data freshness block ───────────────────────────────────────────
          LAST_CALL=$(echo "$FINAL_BODY"     | jq -r '.dataFreshness.lastCallDate // "unknown"' 2>/dev/null)
          CALLS_MTH=$(echo "$FINAL_BODY"     | jq -r '.dataFreshness.callsThisMonth // 0' 2>/dev/null)
          MTGS_MTH=$(echo "$FINAL_BODY"      | jq -r '.dataFreshness.meetingsThisMonth // 0' 2>/dev/null)
          PROSPECTS=$(echo "$FINAL_BODY"     | jq -r '.dataFreshness.prospectCount // 0' 2>/dev/null)
          DAYS_STALE=$(echo "$FINAL_BODY"    | jq -r '.dataFreshness.daysStale // "?"' 2>/dev/null)

          if [ "$DAYS_STALE" = "0" ]; then STALE_NOTE="(today)"
          elif [ "$DAYS_STALE" = "1" ]; then STALE_NOTE="(yesterday)"
          elif echo "$DAYS_STALE" | grep -qE '^[0-9]+$' && [ "$DAYS_STALE" -gt 3 ]; then
            STALE_NOTE="⚠️ ${DAYS_STALE} days ago — possibly stale"
          else
            STALE_NOTE="${DAYS_STALE}d ago"
          fi

          FRESH_BLOCK=$(printf 'Last call: %s %s\nThis month: %s calls · %s meetings\nProspects in sheet: %s' \
            "$LAST_CALL" "$STALE_NOTE" "$CALLS_MTH" "$MTGS_MTH" "$PROSPECTS")

          # ── Determine title and color ─────────────────────────────────────
          if [ "$FINAL_OK" = "true" ] && [ "$FINAL_HTTP" = "200" ] && [ -z "$HEAL_LOG" ]; then
            TITLE="✅ Dashboard Health Check — All Systems Go"
            COLOR=3066993
            SUMMARY="All integrations healthy."
          elif [ "$FINAL_OK" = "true" ] && [ "$FINAL_HTTP" = "200" ]; then
            TITLE="⚡ Dashboard Health Check — Self-Healed"
            COLOR=16776960
            SUMMARY="Issues detected and resolved automatically."
          else
            FAILED_LIST=$(echo "$FINAL_BODY" | jq -r '
              [.integrations | to_entries[] | select(.value.ok == false) | .key] | join(", ")
            ' 2>/dev/null)
            TITLE="🚨 Dashboard Health Check — Issues Detected"
            COLOR=15158332
            SUMMARY="Failing: ${FAILED_LIST:-unknown}. HTTP $FINAL_HTTP from health endpoint."
          fi

          # ── Compose description (safe for jq --arg) ───────────────────────
          if [ -n "$HEAL_LOG" ]; then
            DESC=$(printf '%s\n\n**Integrations:**\n%s\n\n**Self-Heal Log:**\n%s\n\n**Data Freshness:**\n%s' \
              "$SUMMARY" "$INTEG_BLOCK" "$(echo -e "$HEAL_LOG")" "$FRESH_BLOCK")
          else
            DESC=$(printf '%s\n\n**Integrations:**\n%s\n\n**Data Freshness:**\n%s' \
              "$SUMMARY" "$INTEG_BLOCK" "$FRESH_BLOCK")
          fi

          # Truncate to Discord limit
          DESC=$(echo "$DESC" | head -c 3900)

          # ── Post to Discord ────────────────────────────────────────────────
          jq -n \
            --arg title   "$TITLE" \
            --argjson color "$COLOR" \
            --arg desc    "$DESC" \
            --arg ist     "$IST_TIME" \
            --arg run_url "$RUN_URL" \
            --arg ts      "$UTC_NOW" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                description: $desc,
                fields: [
                  { name: "Checked", value: $ist, inline: true },
                  { name: "Dashboard", value: "[moonlit-horizon.vercel.app](https://moonlit-horizon.vercel.app)", inline: true },
                  { name: "Full Logs", value: ("[View run](" + $run_url + ")"), inline: true }
                ],
                footer: { text: "Runs every 6 hours · GitHub Actions" },
                timestamp: $ts
              }]
            }' | curl -s -X POST "$DISCORD_WEBHOOK" \
                   -H "Content-Type: application/json" \
                   -d @-

          [ "$FINAL_OK" = "true" ] && [ "$FINAL_HTTP" = "200" ] && exit 0 || exit 1
