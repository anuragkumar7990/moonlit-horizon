name: Dashboard Health Check

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # allow manual trigger from GitHub Actions tab

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run endpoint checks
        id: checks
        env:
          BASE_URL: https://moonlit-horizon.vercel.app
          # Stored as GitHub Secret: value is "Basic <base64(admin:YOUR_PASSWORD)>"
          AUTH_HEADER: ${{ secrets.DASHBOARD_AUTH_HEADER }}
        run: |
          set +e   # don't exit on first failure — collect all results

          PASS=0
          FAIL=0
          DETAILS=""

          check() {
            local label="$1"
            local url="$2"
            local extra_check="$3"   # optional jq expression that must return "true"

            HTTP=$(curl -s -o /tmp/body.json -w "%{http_code}" \
              -H "Authorization: $AUTH_HEADER" \
              --connect-timeout 10 --max-time 20 \
              "$url")

            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
              # Optionally validate JSON body
              if [ -n "$extra_check" ]; then
                RESULT=$(jq -r "$extra_check" /tmp/body.json 2>/dev/null)
                if [ "$RESULT" = "true" ]; then
                  PASS=$((PASS + 1))
                  echo "✅ $label ($HTTP)"
                else
                  FAIL=$((FAIL + 1))
                  SNIPPET=$(cat /tmp/body.json | head -c 200)
                  DETAILS="$DETAILS\n• **$label** — HTTP $HTTP but body check failed: \`$SNIPPET\`"
                  echo "❌ $label ($HTTP) — body check failed"
                fi
              else
                PASS=$((PASS + 1))
                echo "✅ $label ($HTTP)"
              fi
            else
              FAIL=$((FAIL + 1))
              SNIPPET=$(cat /tmp/body.json 2>/dev/null | head -c 200)
              DETAILS="$DETAILS\n• **$label** — HTTP $HTTP: \`$SNIPPET\`"
              echo "❌ $label ($HTTP)"
            fi
          }

          # ── Endpoint checks ───────────────────────────────────────────────────
          check "Home page"         "$BASE_URL/"
          check "Prospect Stats"    "$BASE_URL/api/prospect-stats"    'has("byL1Source")'
          check "Supply API"        "$BASE_URL/api/supply"            'has("pipeline")'
          check "Targets API"       "$BASE_URL/api/targets"           'has("metrics")'
          check "Luma Events API"   "$BASE_URL/api/luma-events"       'has("configured")'

          # ── Write outputs ─────────────────────────────────────────────────────
          echo "pass=$PASS"    >> "$GITHUB_OUTPUT"
          echo "fail=$FAIL"    >> "$GITHUB_OUTPUT"
          # multiline output needs special encoding
          DETAILS_ENCODED=$(printf '%s' "$DETAILS" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
          echo "details=$DETAILS_ENCODED" >> "$GITHUB_OUTPUT"

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

      - name: Notify Discord — all good
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PASS: ${{ steps.checks.outputs.pass }}
        run: |
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          IST=$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')
          PAYLOAD=$(jq -n \
            --arg ts "$NOW" \
            --arg ist "$IST" \
            --argjson pass "$PASS" \
            '{
              embeds: [{
                title: "✅ Dashboard Health Check — All Systems Go",
                color: 3066993,
                description: ("All **" + ($pass | tostring) + " endpoints** responded correctly."),
                fields: [
                  { name: "Checked", value: $ist, inline: true },
                  { name: "Dashboard", value: "[moonlit-horizon.vercel.app](https://moonlit-horizon.vercel.app)", inline: true }
                ],
                footer: { text: "Runs every 6 hours · GitHub Actions" },
                timestamp: $ts
              }]
            }')
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify Discord — failures
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PASS: ${{ steps.checks.outputs.pass }}
          FAIL: ${{ steps.checks.outputs.fail }}
          DETAILS_ENCODED: ${{ steps.checks.outputs.details }}
        run: |
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          IST=$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')
          DETAILS=$(python3 -c "import sys,urllib.parse; print(urllib.parse.unquote(sys.stdin.read()))" <<< "$DETAILS_ENCODED")

          PAYLOAD=$(jq -n \
            --arg ts "$NOW" \
            --arg ist "$IST" \
            --argjson pass "$PASS" \
            --argjson fail "$FAIL" \
            --arg details "$DETAILS" \
            '{
              embeds: [{
                title: "🚨 Dashboard Health Check — Issues Detected",
                color: 15158332,
                description: ("**" + ($fail | tostring) + " of " + (($pass + $fail) | tostring) + " endpoints** failed.\n\n" + $details),
                fields: [
                  { name: "Checked", value: $ist, inline: true },
                  { name: "Dashboard", value: "[moonlit-horizon.vercel.app](https://moonlit-horizon.vercel.app)", inline: true },
                  { name: "Action", value: "[View run logs](https://github.com/anuragkumar7990/moonlit-horizon/actions)", inline: false }
                ],
                footer: { text: "Runs every 6 hours · GitHub Actions" },
                timestamp: $ts
              }]
            }')
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
