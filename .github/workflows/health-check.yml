name: Dashboard Health Check

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deep health check, self-heal, and report
        env:
          BASE_URL: https://moonlit-horizon.vercel.app
          AUTH_HEADER: ${{ secrets.DASHBOARD_AUTH_HEADER }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set +e

          IST() { TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST'; }
          NOW() { date -u '+%Y-%m-%dT%H:%M:%SZ'; }
          RUN_URL="https://github.com/anuragkumar7990/moonlit-horizon/actions/runs/$GITHUB_RUN_ID"

          # ── Probe /api/health-deep ─────────────────────────────────────────────
          probe_deep() {
            curl -s -w "\n__STATUS__%{http_code}" \
              -H "Authorization: $AUTH_HEADER" \
              --connect-timeout 15 --max-time 30 \
              "$BASE_URL/api/health-deep"
          }

          parse_and_report() {
            local raw="$1"
            local http=$(echo "$raw" | tail -1 | sed 's/__STATUS__//')
            local body=$(echo "$raw" | head -n -1)

            # Check if we got valid JSON
            if ! echo "$body" | jq . > /dev/null 2>&1; then
              echo "INVALID_JSON|$http|$body"
              return
            fi

            local ok=$(echo "$body" | jq -r '.ok')
            echo "$ok|$http|$body"
          }

          # ── Phase 1: Initial probe ─────────────────────────────────────────────
          echo "=== Initial probe at $(IST) ==="
          RAW1=$(probe_deep)
          RESULT1=$(parse_and_report "$RAW1")
          OK1=$(echo "$RESULT1" | cut -d'|' -f1)
          HTTP1=$(echo "$RESULT1" | cut -d'|' -f2)
          BODY1=$(echo "$RESULT1" | cut -d'|' -f3-)
          echo "  HTTP: $HTTP1, ok: $OK1"

          HEAL_LOG=""
          FINAL_BODY="$BODY1"
          FINAL_HTTP="$HTTP1"
          FINAL_OK="$OK1"
          HEAL_TRIGGERED=false

          if [ "$OK1" = "true" ] && [ "$HTTP1" = "200" ]; then
            echo "All integrations healthy."
          else
            # ── Phase 2: Retry after 20s ───────────────────────────────────────
            HEAL_LOG="${HEAL_LOG}**[$(IST)]** Issues detected on initial probe (HTTP $HTTP1). Waiting 20s before retry…\n"
            echo "Retrying in 20s..."
            sleep 20

            echo "=== Retry probe at $(IST) ==="
            RAW2=$(probe_deep)
            RESULT2=$(parse_and_report "$RAW2")
            OK2=$(echo "$RESULT2" | cut -d'|' -f1)
            HTTP2=$(echo "$RESULT2" | cut -d'|' -f2)
            BODY2=$(echo "$RESULT2" | cut -d'|' -f3-)
            echo "  HTTP: $HTTP2, ok: $OK2"
            HEAL_LOG="${HEAL_LOG}**[$(IST)]** Retry complete — HTTP $HTTP2, healthy: $OK2\n"

            if [ "$OK2" = "true" ] && [ "$HTTP2" = "200" ]; then
              FINAL_BODY="$BODY2"
              FINAL_HTTP="$HTTP2"
              FINAL_OK="$OK2"
              HEAL_LOG="${HEAL_LOG}**[$(IST)]** ✅ Resolved on retry — was a transient issue.\n"
            else
              # ── Phase 3: Trigger Vercel redeploy ──────────────────────────────
              if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
                HEAL_LOG="${HEAL_LOG}**[$(IST)]** Triggering Vercel redeploy…\n"
                echo "Triggering Vercel deploy hook..."
                DEPLOY_RESP=$(curl -s -X POST "$VERCEL_DEPLOY_HOOK")
                DEPLOY_ID=$(echo "$DEPLOY_RESP" | jq -r '.job.id // .id // "triggered"' 2>/dev/null)
                HEAL_LOG="${HEAL_LOG}**[$(IST)]** Redeploy triggered (job: \`$DEPLOY_ID\`). Waiting 90s…\n"
                echo "Redeploy triggered. Sleeping 90s..."
                HEAL_TRIGGERED=true
                sleep 90

                # ── Phase 4: Post-deploy verify ──────────────────────────────
                echo "=== Post-redeploy probe at $(IST) ==="
                RAW3=$(probe_deep)
                RESULT3=$(parse_and_report "$RAW3")
                OK3=$(echo "$RESULT3" | cut -d'|' -f1)
                HTTP3=$(echo "$RESULT3" | cut -d'|' -f2)
                BODY3=$(echo "$RESULT3" | cut -d'|' -f3-)
                echo "  HTTP: $HTTP3, ok: $OK3"
                HEAL_LOG="${HEAL_LOG}**[$(IST)]** Post-redeploy check — HTTP $HTTP3, healthy: $OK3\n"
                FINAL_BODY="$BODY3"
                FINAL_HTTP="$HTTP3"
                FINAL_OK="$OK3"

                if [ "$OK3" = "true" ]; then
                  HEAL_LOG="${HEAL_LOG}**[$(IST)]** ✅ Redeploy fixed the issue.\n"
                else
                  HEAL_LOG="${HEAL_LOG}**[$(IST)]** ⚠️ Redeploy did NOT resolve all failures. Manual review needed.\n"
                fi
              else
                HEAL_LOG="${HEAL_LOG}**[$(IST)]** No VERCEL_DEPLOY_HOOK configured — skipping redeploy.\n"
                FINAL_BODY="$BODY2"
                FINAL_HTTP="$HTTP2"
                FINAL_OK="$OK2"
              fi
            fi
          fi

          # ── Build Discord embed from health-deep JSON ──────────────────────────
          build_discord_payload() {
            local body="$1"
            local heal_log="$2"
            local final_ok="$3"
            local final_http="$4"

            python3 - <<PYEOF
import json, sys

body_str = '''$body'''
heal_log = '''$heal_log'''
final_ok  = '$final_ok'
final_http = '$final_http'
run_url   = '$RUN_URL'

try:
    data = json.loads(body_str)
except Exception as e:
    data = {}

integrations = data.get('integrations', {})
freshness    = data.get('dataFreshness', {})

# Integration labels and icons
LABELS = {
    'googleSheets':   ('Google Sheets',   'sheets'),
    'zoho':           ('Zoho CRM',        'zoho'),
    'luma':           ('Luma Events',     'luma'),
    'circleback':     ('Circleback',      'cb'),
    'trainerSheets':  ('Trainer Sheets',  'trainer'),
    'discordBot':     ('Discord Bot',     'discord'),
}

lines = []
failed = []
warnings = []

for key, (label, _) in LABELS.items():
    check = integrations.get(key, {})
    ok    = check.get('ok')        # True, False, or None
    detail = check.get('detail', '')
    warn   = check.get('warning', '')
    lat    = check.get('latencyMs')
    lat_str = f' _{lat}ms_' if lat else ''

    if ok is True:
        icon = '✅'
    elif ok is False:
        icon = '❌'
        failed.append(label)
    else:
        icon = '⚪'   # not configured / not testable

    line = f'{icon} **{label}**{lat_str} — {detail}'
    if warn:
        line += f'\n  ⚠️ {warn}'
        warnings.append(warn)
    lines.append(line)

# Data freshness block
fresh_lines = []
last_call = freshness.get('lastCallDate') or 'unknown'
days_stale = freshness.get('daysStale')
calls_month = freshness.get('callsThisMonth', 0)
meetings_month = freshness.get('meetingsThisMonth', 0)
prospects = freshness.get('prospectCount', 0)

stale_note = ''
if days_stale is not None:
    if days_stale == 0:
        stale_note = ' (today)'
    elif days_stale <= 2:
        stale_note = f' ({days_stale}d ago)'
    else:
        stale_note = f' ⚠️ {days_stale} days ago — data may be stale'

fresh_lines.append(f'Last call: {last_call}{stale_note}')
fresh_lines.append(f'This month: {calls_month} calls, {meetings_month} meetings')
fresh_lines.append(f'Total prospects in sheet: {prospects}')

# Compose embed
all_ok = final_ok == 'true' and final_http == '200'

if all_ok and not heal_log.strip():
    color = 3066993   # green
    title = '✅ Dashboard Health Check — All Systems Go'
    summary = f'All integrations healthy.'
elif all_ok:
    color = 16776960  # gold
    title = '⚡ Dashboard Health Check — Healed'
    summary = f'Issues detected and resolved automatically.'
else:
    color = 15158332  # red
    title = f'🚨 Dashboard Health Check — {len(failed)} Integration(s) Failing'
    summary = f'Failed: **{", ".join(failed)}**' if failed else f'HTTP {final_http} from health endpoint'

desc_parts = [summary, '', '**Integrations:**', '\n'.join(lines)]
if heal_log.strip():
    desc_parts += ['', '**Self-Heal Log:**', heal_log.strip()]
desc_parts += ['', '**Data Freshness:**', '\n'.join(fresh_lines)]

desc = '\n'.join(desc_parts)[:3900]

payload = {
    'embeds': [{
        'title': title,
        'color': color,
        'description': desc,
        'fields': [
            {'name': 'Checked', 'value': '$(IST)', 'inline': True},
            {'name': 'Dashboard', 'value': '[moonlit-horizon.vercel.app](https://moonlit-horizon.vercel.app)', 'inline': True},
            {'name': 'Full Logs', 'value': f'[View run]({run_url})', 'inline': True},
        ],
        'footer': {'text': 'Runs every 6 hours · GitHub Actions'},
        'timestamp': '$(NOW)',
    }]
}

print(json.dumps(payload))
PYEOF
          }

          DISCORD_PAYLOAD=$(build_discord_payload "$FINAL_BODY" "$HEAL_LOG" "$FINAL_OK" "$FINAL_HTTP")

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$DISCORD_PAYLOAD"

          # Fail the GitHub run if still broken
          [ "$FINAL_OK" = "true" ] && [ "$FINAL_HTTP" = "200" ] && exit 0 || exit 1
