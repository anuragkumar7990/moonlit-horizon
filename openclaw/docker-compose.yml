version: "3.9"

services:
  openclaw:
    image: openclaw/openclaw:latest
    container_name: moonlit-openclaw
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./agents:/app/agents:ro
      - openclaw_data:/app/data
    environment:
      - NODE_ENV=production
      - OPENCLAW_PORT=3001
      # Paste your integration tokens below (or use a .env file)
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET}
      - ZOHO_REFRESH_TOKEN=${ZOHO_REFRESH_TOKEN}
      - SHEETS_SPREADSHEET_ID=${SHEETS_SPREADSHEET_ID}
      - CIRCLEBACK_API_KEY=${CIRCLEBACK_API_KEY}
      - DASHBOARD_WEBHOOK_URL=${DASHBOARD_WEBHOOK_URL}
      # The Next.js /api/book endpoint URL for confirming bookings
      - DASHBOARD_BOOK_URL=${DASHBOARD_BOOK_URL}

volumes:
  openclaw_data:
